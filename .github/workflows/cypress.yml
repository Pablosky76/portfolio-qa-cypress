name: Portfolio QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tanda: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar tanda ${{ matrix.tanda }} sobre el portfolio publicado
        run: npm run test:tanda${{ matrix.tanda }}
      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-qa-tanda${{ matrix.tanda }}-${{ github.run_number }}
          path: |
            cypress/reports/
            cypress/screenshots/
          retention-days: 14
          if-no-files-found: warn
